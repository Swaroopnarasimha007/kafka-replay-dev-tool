<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">Kafka Dev Tool system architecture</title><desc id="desc">React connects to a Spring Boot API and planner. A database persists plans, approvals and worker leases. The replay worker reads dead-letter events and transactionally publishes destination records with audit receipts to Kafka. Committed receipts reconcile progress after failures. An embedded mock provides simulation, while Mini Kafka runs separately.</desc>
