# Reloaded while running. Invalid edits are rejected; last valid configuration stays active.
bootstrap.servers=localhost:19092
topic.main=orders
topic.dlt=orders.DLT
topic.main.max.message.bytes=1048588
topic.dlt.max.message.bytes=2097152
topic.main.retention.ms=-1
topic.dlt.retention.ms=-1
# Both topics always have 3 partitions; receipt topic has 1.
consumer.group=orders-demo
# Allowed codes: NONE, VALIDATION, BUSINESS_REJECT, TRANSIENT, INVALID_JSON
# A code in errors.forbidden may not appear in any initial/replay error list.
errors.forbidden=
consumer.1.enabled=true
consumer.2.enabled=true
consumer.1.initial.errors=VALIDATION,BUSINESS_REJECT,TRANSIENT,INVALID_JSON
consumer.2.initial.errors=VALIDATION,BUSINESS_REJECT,TRANSIENT,INVALID_JSON
consumer.1.replay.errors=
consumer.2.replay.errors=
consumer.1.delay.ms=0
consumer.2.delay.ms=0
# Attribute rules derive VALIDATION / BUSINESS_REJECT even when producer.error=NONE.
consumer.1.minimum.amount=0
consumer.2.minimum.amount=0
consumer.1.rejected.customers=
consumer.2.rejected.customers=
consumer.max.dlt.hops=3
producer.1.enabled=true
producer.2.enabled=true
producer.1.count=30
producer.2.count=30
producer.1.interval.ms=100
producer.2.interval.ms=100
producer.1.error=VALIDATION
producer.2.error=BUSINESS_REJECT
producer.1.error.every=2
producer.2.error.every=3
producer.1.customer=tier-a
producer.2.customer=tier-b
producer.1.amount=100
producer.2.amount=200
producer.1.payload.bytes=128
producer.2.payload.bytes=128
# true seeds DLT directly, useful for testing replay transport failures with oversized records.
producer.1.seed.dlt=false
producer.2.seed.dlt=false
# Replace this value to trigger another finite batch without restarting.
producer.run.id=first-run
